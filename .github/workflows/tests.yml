name: tests
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  test:
    name: JIT (NodeData=${{ matrix.nodedata }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        nodedata: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build libraries and tests
        run: dotnet build tests/UnityAsset.NET.Tests -c Release -p:UnityAssetNodeData=${{ matrix.nodedata }}
      - name: Test
        run: dotnet test tests/UnityAsset.NET.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Smoke and synthetic benchmark
        run: dotnet run --project tests/UnityAsset.NET.AotSmoke -c Release -p:UnityAssetNodeData=${{ matrix.nodedata }} -- --benchmark
      - name: Build interface generator
        if: matrix.nodedata == false
        run: dotnet build UnityAsset.NET.UnityTypeGen -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.nodedata }}
          path: TestResults
          if-no-files-found: ignore
  native-aot:
    name: NativeAOT smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Publish (automatically selects NodeData)
        run: dotnet publish tests/UnityAsset.NET.AotSmoke -c Release -r linux-x64 -p:PublishAot=true -o artifacts/aot-smoke
      - name: Native smoke and synthetic benchmark
        run: ./artifacts/aot-smoke/UnityAsset.NET.AotSmoke --benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: native-aot-smoke
          path: artifacts/aot-smoke
